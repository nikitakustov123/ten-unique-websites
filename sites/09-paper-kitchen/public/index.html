<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paper Kitchen — рукописная книга рецептов</title>
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="masthead">
    <svg class="doodle whisk" viewBox="0 0 120 120" aria-hidden="true"><path d="M60 110 L60 70 M60 70 C30 50 30 10 60 10 C90 10 90 50 60 70 M60 70 C45 50 45 15 60 10 M60 70 C75 50 75 15 60 10" /></svg>
    <h1>Бумажная <span>Кухня</span></h1>
    <p class="tagline">рецепты — исписанные, заляпанные и рассказанные с любовью</p>
    <svg class="doodle underline" viewBox="0 0 400 30" aria-hidden="true"><path d="M5 20 C80 5 160 28 240 12 S360 8 395 18" /></svg>
    <svg class="doodle spoon" viewBox="0 0 120 120" aria-hidden="true"><path d="M30 100 L75 55 M75 55 C70 35 85 15 100 20 C110 30 95 55 75 55" /></svg>
  </header>

  <nav class="toolbar">
    <input id="q" type="search" placeholder="поиск по блюду или ингредиенту…" />
    <div class="tags" id="tags"></div>
    <select id="sort" aria-label="Сортировка">
      <option value="new">сначала новые</option>
      <option value="top">лучшие по оценкам</option>
      <option value="quick">самые быстрые</option>
    </select>
    <button class="sticker" id="newBtn">✎ добавить свой рецепт</button>
  </nav>

  <main class="pinboard" id="board"></main>

  <div class="book" id="book" hidden>
    <article class="page" id="page"></article>
  </div>

  <dialog id="newDlg">
    <form id="newForm" class="notepad">
      <h2>Новая карточка рецепта</h2>
      <div class="two"><input name="title" placeholder="Название рецепта" required maxlength="100" /><input name="emoji" placeholder="🍲" maxlength="8" class="emoji-in" /></div>
      <input name="summary" placeholder="Пара слов о блюде" required maxlength="200" />
      <div class="three">
        <label>минут<input name="minutes" type="number" min="1" max="1440" value="30" required /></label>
        <label>порций<input name="servings" type="number" min="1" max="24" value="4" required /></label>
        <label>категория<select name="tag" id="tagSelect"></select></label>
      </div>
      <input name="author" placeholder="Ваше имя" maxlength="50" />
      <h3>Ингредиенты</h3>
      <div id="ingRows"></div>
      <button type="button" class="link" id="addIng">+ ещё ингредиент</button>
      <h3>Шаги</h3>
      <div id="stepRows"></div>
      <button type="button" class="link" id="addStep">+ ещё шаг</button>
      <div class="actions"><button type="button" class="link" id="cancelNew">отмена</button><button type="submit" class="sticker">приколоть на доску</button></div>
    </form>
  </dialog>

  <footer class="foot">сделано руками в муке · © 2026 Бумажная Кухня</footer>
  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
