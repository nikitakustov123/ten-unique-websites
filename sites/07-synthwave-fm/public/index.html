<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SYNTHWAVE FM — 84.0 · вещаем прямо из 1984-го</title>
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="sky"></div>
    <div class="sun"></div>
    <div class="mountains"></div>
    <div class="grid-floor"><div class="grid-lines"></div></div>
  </div>

  <header class="top">
    <h1 class="logo">SYNTHWAVE<span>FM</span></h1>
    <p class="freq">84.0 МГц · слушают <span id="listeners">…</span></p>
  </header>

  <section class="player">
    <div class="deck">
      <button class="play" id="playBtn" aria-label="Слушать">▶</button>
      <div class="np">
        <p class="label"><span class="live-dot"></span> В ЭФИРЕ · <b id="showTitle">…</b>, ведущий <b id="showHost">…</b></p>
        <p class="track" id="trackLine">Нажмите ▶, чтобы включить эфир</p>
        <p class="ded" id="dedication"></p>
      </div>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5" aria-label="Громкость" />
    </div>
    <canvas id="viz" width="900" height="140" aria-hidden="true"></canvas>
  </section>

  <main class="panels">
    <section class="panel">
      <h2>СТОЛ ЗАЯВОК</h2>
      <form id="reqForm" class="req-form">
        <input name="artist" placeholder="Исполнитель" maxlength="80" required />
        <input name="title" placeholder="Трек" maxlength="100" required />
        <input name="requested_by" placeholder="Ваш ник" maxlength="30" />
        <input name="dedication" placeholder="Посвящение (необязательно)" maxlength="140" />
        <button class="btn" type="submit">ОТПРАВИТЬ ЗАЯВКУ</button>
      </form>
      <ol class="queue" id="queue"></ol>
      <button class="btn ghost" id="djNext" title="Пульт диджея: отметить верхнюю заявку сыгранной">⏭ DJ: ЗАПУСТИТЬ ТОП-ЗАЯВКУ</button>
    </section>

    <section class="panel">
      <h2>РАСПИСАНИЕ НА СЕГОДНЯ</h2>
      <ul class="schedule" id="schedule"></ul>
    </section>
  </main>

  <footer class="foot">НЕОН В ЭФИРЕ С 1984 ГОДА · © 2026 SYNTHWAVE FM</footer>
  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
