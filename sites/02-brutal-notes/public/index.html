<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BRUTAL/NOTES — громкие заметки для громких мыслей</title>
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <h1 class="logo"><span>BRUTAL</span>/NOTES</h1>
    <div class="stats" id="stats"></div>
    <button class="btn btn-new" id="newBtn">+ НОВАЯ ЗАМЕТКА</button>
  </header>

  <div class="ticker" aria-hidden="true"><div>БЕЗ ВОДЫ ✱ БЕЗ ГРАДИЕНТОВ ✱ ТОЛЬКО ЗАМЕТКИ ✱ ЗАПИШИ ЭТО ✱ БЕЗ ВОДЫ ✱ БЕЗ ГРАДИЕНТОВ ✱ ТОЛЬКО ЗАМЕТКИ ✱ ЗАПИШИ ЭТО ✱&nbsp;</div></div>

  <section class="toolbar">
    <input id="search" type="search" placeholder="ИСКАТЬ ВСЁ…" autocomplete="off" />
    <div class="tags" id="tagBar"></div>
  </section>

  <main class="board" id="board"></main>
  <p class="empty" id="empty" hidden>ТУТ ПУСТО. НАПИШИ ЧТО-НИБУДЬ.</p>

  <dialog id="editor">
    <form method="dialog" id="noteForm">
      <div class="dlg-head">
        <h2 id="dlgTitle">НОВАЯ ЗАМЕТКА</h2>
        <button type="button" class="x" id="closeDlg" aria-label="Закрыть">✕</button>
      </div>
      <input name="title" placeholder="ЗАГОЛОВОК" maxlength="120" required />
      <textarea name="body" placeholder="Вывали сюда всё из головы…" maxlength="4000"></textarea>
      <input name="tags" placeholder="теги, через, запятую" maxlength="200" />
      <div class="colors" id="colors">
        <label><input type="radio" name="color" value="yellow" checked /><span class="sw yellow"></span></label>
        <label><input type="radio" name="color" value="pink" /><span class="sw pink"></span></label>
        <label><input type="radio" name="color" value="blue" /><span class="sw blue"></span></label>
        <label><input type="radio" name="color" value="green" /><span class="sw green"></span></label>
        <label><input type="radio" name="color" value="orange" /><span class="sw orange"></span></label>
        <label><input type="radio" name="color" value="white" /><span class="sw white"></span></label>
      </div>
      <label class="pin-check"><input type="checkbox" name="pinned" /> ЗАКРЕПИТЬ НАВЕРХУ</label>
      <div class="dlg-actions">
        <button type="button" class="btn btn-danger" id="deleteBtn" hidden>УДАЛИТЬ</button>
        <button type="submit" class="btn">СОХРАНИТЬ</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast"></div>
  <footer class="foot">СОБРАНО ИЗ БЕТОНА И SQLITE ✱ 2026</footer>
  <script src="app.js"></script>
</body>
</html>
