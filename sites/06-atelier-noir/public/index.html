<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atelier Noir — дом высокой моды</title>
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="cursor" id="cursor" aria-hidden="true"><span id="cursorLabel"></span></div>
  <div class="intro" id="intro" aria-hidden="true"><span>A</span><span>N</span></div>

  <header class="nav">
    <span>Париж — Милан</span>
    <a href="#" class="mark">ATELIER NOIR</a>
    <a href="#rdv" class="nav-link" data-cursor="Запись">Записаться</a>
  </header>

  <section class="hero">
    <h1 class="split">Искусство<br /><em>меньшего.</em></h1>
    <p class="hero-sub">Дом высокой моды · основан в 1987 году</p>
    <div class="scroll-cue">Листайте</div>
  </section>

  <section class="manifesto">
    <p class="big-quote" id="quote">Мы не одеваем тела. Мы одеваем тишину, жесты и пространство между ними.</p>
  </section>

  <div id="collections"></div>

  <section id="rdv" class="rdv">
    <div class="rdv-head">
      <p class="label">Только по записи</p>
      <h2>Встреча<br /><em>в нашем Доме</em></h2>
    </div>
    <form id="rdvForm" class="rdv-form">
      <div class="field"><label>Услуга</label><div class="services" id="services"></div></div>
      <div class="field"><label>Дата</label><div class="days" id="days"></div></div>
      <div class="field"><label>Время</label><div class="slots" id="slots"><span class="muted">Сначала выберите дату</span></div></div>
      <div class="row">
        <div class="field"><label for="name">Имя</label><input id="name" name="name" required maxlength="80" /></div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required maxlength="120" /></div>
      </div>
      <div class="field"><label for="note">Пожелания для ателье</label><textarea id="note" name="note" maxlength="400" rows="3"></textarea></div>
      <button type="submit" class="cta" data-cursor="Записаться">Отправить заявку <span>→</span></button>
      <p class="confirm" id="confirm" role="status"></p>
    </form>
  </section>

  <footer class="footer">
    <div class="huge">NOIR</div>
    <div class="foot-row"><span>Париж, улица Тишины, 12</span><span>© 2026 Atelier Noir</span></div>
  </footer>
  <script src="app.js"></script>
</body>
</html>
